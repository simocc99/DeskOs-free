name: DeskFree

options:
  bundleIdPrefix: com.simocc99
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  DeskFree:
    type: application
    platform: iOS
    sources:
      - path: Sources/DeskFree
    info:
      path: Sources/DeskFree/Info.plist
      properties:
        CFBundleDisplayName: DeskFree
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: DeskFree saves edited pictures to your Photos library when you ask it to.
        NSPhotoLibraryUsageDescription: DeskFree reads videos and pictures you choose to edit them or use them as wallpaper.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simocc99.deskfree
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIStatusBarHidden: YES

  DeskFreeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/DeskFreeTests
    dependencies:
      - target: DeskFree
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.simocc99.deskfree.tests

schemes:
  DeskFree:
    build:
      targets:
        DeskFree: all
        DeskFreeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DeskFreeTests
    archive:
      config: Release
