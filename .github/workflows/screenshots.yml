name: Screenshots

# Builds the app, launches it in the iPhone simulator, takes screenshots and force-pushes
# them to the throw-away `ci-screenshots` branch so the UI can be reviewed without a Mac.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/screenshots-trigger"

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        run: echo "UDID=$(.github/scripts/pick-simulator.sh)" >> "$GITHUB_ENV"

      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project DeskFree.xcodeproj \
            -scheme DeskFree \
            -destination "id=$UDID" \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Boot simulator
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Launch and capture
        run: |
          APP=build/sim/Build/Products/Debug-iphonesimulator/DeskFree.app
          xcrun simctl install booted "$APP"
          mkdir -p shots

          capture() {
            name="$1"; shift
            xcrun simctl launch booted com.simocc99.deskfree "$@"
            sleep 8
            xcrun simctl io booted screenshot --type=png "shots/$name.png"
            case "$name" in landscape*) sips --rotate 270 "shots/$name.png" >/dev/null ;; esac
            xcrun simctl terminate booted com.simocc99.deskfree
          }

          capture portrait -deskfree-demo
          for scene in windows browser files pdf image notes calculator settings video spotlight launchpad switcher menu; do
            capture "landscape-$scene" -deskfree-demo -deskfree-landscape -deskfree-scene "$scene"
          done
          ls -la shots

      - name: Publish screenshots to the ci-screenshots branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          cp -R shots /tmp/shots
          git checkout --orphan ci-screenshots
          git rm -rf --quiet . || true
          cp /tmp/shots/*.png .
          git add *.png
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f origin ci-screenshots
