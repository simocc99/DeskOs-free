name: Screenshots

# Manual run: builds the app, launches it in the iPhone simulator and prints small JPEG
# screenshots (base64) to the job log, so the UI can be reviewed without a Mac.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/screenshots.yml"

jobs:
  shots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project DeskFree.xcodeproj \
            -scheme DeskFree \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Boot simulator
        run: |
          xcrun simctl boot "iPhone 16" || true
          xcrun simctl bootstatus "iPhone 16" -b

      - name: Launch and capture
        run: |
          APP=build/sim/Build/Products/Debug-iphonesimulator/DeskFree.app
          xcrun simctl install booted "$APP"

          capture() {
            name="$1"; width="$2"; shift 2
            xcrun simctl launch booted com.simocc99.deskfree "$@"
            sleep 10
            xcrun simctl io booted screenshot --type=png "/tmp/$name.png"
            sips -s format jpeg -s formatOptions 55 -Z "$width" "/tmp/$name.png" --out "/tmp/$name.jpg" >/dev/null
            echo "@@SHOT $name BEGIN"
            base64 -i "/tmp/$name.jpg" | fold -w 3000
            echo
            echo "@@SHOT $name END"
            xcrun simctl terminate booted com.simocc99.deskfree
          }

          capture landscape 760 -deskfree-demo -deskfree-landscape
          capture portrait 380 -deskfree-demo
